name: Build Android APK

# Builds a debug APK of the TGS Ledger Android WebView wrapper on every push
# to main, and whenever it's triggered manually from the Actions tab.
# The finished .apk is uploaded as a workflow artifact you can download —
# no local Android Studio or SDK needed.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web app dependencies
        run: npm ci

      - name: Write Supabase env file
        # Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as repository
        # secrets (Settings -> Secrets and variables -> Actions) so the
        # built app can reach your Supabase project.
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production

      - name: Build web app
        run: npm run build

      - name: Copy web build into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgs-ledger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
